name: Android Build & Release

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build Type'
        type: choice
        options:
          - debug
          - release
        default: debug
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    env:
      BUILD_TYPE: ${{ github.event.inputs.build-type || 'release' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-disabled: false

      - name: Decode Keystore
        # debug 构建也使用 release 签名配置（见 build.gradle.kts），因此始终需要 keystore
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
          else
            # 无签名密钥时生成临时 debug keystore，使构建不中断
            keytool -genkeypair -v \
              -keystore release.jks \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
          fi

      - name: Build APK
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew :qishui-music:assembleRelease --build-cache
          else
            ./gradlew :qishui-music:assembleDebug --build-cache
          fi
        env:
          RELEASE_STORE_FILE: ../release.jks
          # 使用 secrets 中的签名信息；未配置时回退到临时 debug keystore 的默认值
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || 'android' }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || 'androiddebugkey' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

      - name: Collect APKs
        run: |
          mkdir -p collected-apks

          # 复制所有 APK 文件
          find . -name "*.apk" -path "*/build/outputs/apk/${{ env.BUILD_TYPE }}/*" -exec cp {} collected-apks/ \;

          echo "Collected files:"
          ls -lh collected-apks/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_TYPE }}-apks
          path: collected-apks/
          if-no-files-found: error
          archive: false

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: collected-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          rm -f release.jks || true
          rm -rf collected-apks || true
